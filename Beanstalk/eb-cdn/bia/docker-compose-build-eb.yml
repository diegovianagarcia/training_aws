services:
  bia:
    image: bia:latest
    container_name: bia
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BIA_API_URL=http://bia-dev-diego.us-east-1.elasticbeanstalk.com
    ports:
      - 80:8080
    environment:
      - DB_HOST
      - DB_PORT
      - DB_PWD
      - DB_USER
