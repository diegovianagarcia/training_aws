services:
  server:
    image: bia-local:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BIA_API_URL=http://localhost:3001
    container_name: bia
    ports:
      - 3001:8080
    depends_on:
      - database
      - redis
    environment:
      DB_USER: postgres
      DB_PWD: postgres
      DB_HOST: database
      DB_PORT: 5432
  database:
    image: postgres:17.1
    container_name: database
    environment:
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=postgres"
      - "POSTGRES_DB=bia"
    ports:
      - 5433:5432
    volumes:
      - db:/var/lib/postgresql/data
  redis:
    image: valkey/valkey:8.1-alpine
    container_name: redis
    ports:
      - 6379:6379
volumes:
  db:
